/* ============================= AUTH =============================
   Two tiers:
   · VIEW  — anyone signed in with a Google Workspace account on an iLearn domain.
   · EDIT  — the Department Head only.
   Both are enforced twice: in the UI here (so the page behaves sensibly) and in the
   Firebase security rules (the actual boundary — editing the page in devtools gains
   nothing because the database itself refuses the read or write).                */
const ALLOWED_EDITOR_EMAIL = 'gcosgun@ilearnschools.org';
const ALLOWED_DOMAINS = [
  'ilearnschools.org',
  'bergencharter.org',
  'passaiccharter.org',
  'patersoncharter.org',
  'hudsoncharter.org',
  'bronxcharter.org'
];
function isAllowedDomain(email){
  if (!email) return false;
  const at = String(email).toLowerCase().lastIndexOf('@');
  if (at === -1) return false;
  return ALLOWED_DOMAINS.indexOf(String(email).toLowerCase().slice(at + 1)) !== -1;
}

let currentUser = null;      // Firebase auth user object, or null
let isAuthorizedEditor = false;
let canView = false;         // signed in on an approved domain
let authReady = false;       // Firebase has reported an initial auth state
let authError = '';          // last sign-in failure, shown on the gate

/* Google blocks sign-in popups inside cross-origin iframes (and partitions the
   storage that keeps a session alive), so when the portal is embedded — e.g. in
   Google Sites — we send people to a real tab instead of failing silently. */
function inIframe(){
  try { return window.self !== window.top; } catch (e) { return true; }
}

// Every stored field is editable only by ALLOWED_EDITOR_EMAIL. Everyone else gets a
// full read-only view (they can still navigate, switch role/campus, print, and follow
// links). Kept as a helper so the client-side lock and the Firebase security rules
// describe the same set — currently "all of it".
function isLockedKey(key){ return true; }

/* Single source of truth for the read-only lock. Runs after every render, so any
   data-entry field — present or future — is disabled unless the Department Head is
   signed in. Belt-and-braces with the Firebase rules, which enforce the same thing
   server-side (the client-side disable is just UX; the rules are the real security). */
function applyLockState(){
  const locked = !isAuthorizedEditor;
  const title = locked ? 'View only — only the Department Head can edit this' : '';
  document.querySelectorAll('[data-store],[data-store-check],[data-store-select]').forEach(el => {
    const key = el.dataset.store || el.dataset.storeCheck || el.dataset.storeSelect;
    const shouldLock = locked && isLockedKey(key);
    el.disabled = shouldLock;
    if (shouldLock) el.setAttribute('title', title); else el.removeAttribute('title');
  });
}

/* Copy helper: hints that invite data entry should not be shown to view-only users. */
function editHint(text){ return isAuthorizedEditor ? text : 'View only'; }

function initAuth(){
  // Watchdog: if Firebase never reports an auth state — SDK blocked, no storage access
  // in a sandboxed frame, offline — fall through to the sign-in gate instead of
  // leaving the visitor staring at "Checking your access…" indefinitely.
  setTimeout(() => {
    if (!authReady) {
      authReady = true;
      console.warn('[auth] no auth state after 5s — showing the sign-in gate.');
      renderAll();
    }
  }, 5000);

  if (typeof firebase === 'undefined' || !firebase.auth) {
    console.warn('[auth] Firebase Auth did not load — portal stays locked.');
    authReady = true; renderAll(); return;
  }
  try {
    firebase.auth();
  } catch (err) {
    // Sandboxed frames can throw on init because Auth needs storage it cannot reach.
    console.warn('[auth] Firebase Auth could not initialize here.', err);
    authReady = true; renderAll(); return;
  }
  // If we arrived back from a redirect sign-in, surface any failure from it.
  try {
    firebase.auth().getRedirectResult().catch(err => {
      const code = err && err.code ? err.code : '';
      if (code) showAuthError(authMessage(code, err && err.message ? err.message : ''), code);
    });
  } catch (e) { /* older SDKs may not expose this; not fatal */ }

  firebase.auth().onAuthStateChanged(user => {
    currentUser = user;
    const email = user && user.email ? user.email.toLowerCase() : '';
    canView = !!(user && isAllowedDomain(email));
    isAuthorizedEditor = !!(user && email === ALLOWED_EDITOR_EMAIL);
    authReady = true;
    // Only talk to the database once the account is allowed to read it.
    if (canView && !fbRef) initFirebaseSync();
    renderAll();
  });
}
/* Turn a Firebase error code into something a person can act on. The raw code is
   shown too — it identifies which console setting is missing far faster than prose. */
function authMessage(code, fallback){
  switch (code) {
    case 'auth/operation-not-allowed':
      return 'Google sign-in is not switched on for this Firebase project. In the Firebase console: Authentication → Sign-in method → Google → Enable → Save.';
    case 'auth/unauthorized-domain':
      return 'This web address is not on the Firebase authorised list. In the Firebase console: Authentication → Settings → Authorised domains → add ' + location.hostname + '.';
    case 'auth/popup-blocked':
    case 'auth/cancelled-popup-request':
      return 'Your browser blocked the sign-in window, so we are redirecting you instead. If nothing happens, allow pop-ups for this page and try again.';
    case 'auth/popup-closed-by-user':
      return 'The sign-in window closed before finishing. Please try again.';
    case 'auth/network-request-failed':
      return 'The browser could not reach Google to sign in. Check the connection, or whether the school network blocks accounts.google.com.';
    default:
      return fallback || 'Sign-in failed.';
  }
}

function showAuthError(msg, code){
  authError = msg + (code ? '  [' + code + ']' : '');
  renderAll();
}

function signIn(){
  authError = '';
  if (typeof firebase === 'undefined' || !firebase.auth) {
    // Previously this returned silently, so the button appeared to do nothing.
    showAuthError('The Google sign-in library did not load, so sign-in cannot start. This is usually a blocked network request to gstatic.com — try a different network, or ask IT whether it is filtered.', 'sdk-missing');
    return;
  }
  let provider;
  try {
    provider = new firebase.auth.GoogleAuthProvider();
    provider.setCustomParameters({ prompt: 'select_account' });
  } catch (err) {
    showAuthError('Could not start Google sign-in.', 'provider-init-failed');
    return;
  }
  try {
    firebase.auth().signInWithPopup(provider).catch(err => {
      const code = err && err.code ? err.code : '';
      // Managed school browsers often block pop-ups by policy. Redirect always works.
      if (code === 'auth/popup-blocked' || code === 'auth/cancelled-popup-request') {
        authError = '';
        try { firebase.auth().signInWithRedirect(provider); return; }
        catch (e) { /* fall through to the message below */ }
      }
      showAuthError(authMessage(code, err && err.message ? err.message : String(err)), code);
    });
  } catch (err) {
    showAuthError(authMessage(err && err.code, err && err.message ? err.message : String(err)), err && err.code);
  }
}
function signOutUser(){
  // Clear the local cache too, so department data isn't left sitting in the browser
  // of a shared or public computer after someone signs out.
  try { localStorage.removeItem(STORE_KEY); } catch (e) {}
  STORE = {};
  if (typeof firebase === 'undefined' || !firebase.auth) { renderAll(); return; }
  firebase.auth().signOut();
}

/* ============================= STORE (persisted data entry) ============================= */
const STORE_KEY = 'esl_portal_store_v1';
let STORE = {};
try { STORE = JSON.parse(localStorage.getItem(STORE_KEY)) || {}; } catch(e) { STORE = {}; }
function saveStore(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(STORE)); }catch(e){} }
function sget(key, def){ return (STORE[key] === undefined || STORE[key] === null) ? def : STORE[key]; }
function sset(key, val, opts){
  const fromRemote = !!(opts && opts.fromRemote);
  // Refuse local edits to locked fields unless the Department Head is signed in.
  // (Remote values arriving from Firebase are always accepted — they already passed
  // the server-side rules.)
  if (!fromRemote && isLockedKey(key) && !isAuthorizedEditor) return;
  STORE[key] = val;
  saveStore();
  if (fbRef && !fromRemote) {
    fbRef.child(fbKey(key)).set(val).catch(err => console.warn('[sync] write failed', key, err));
  }
}
// Firebase RTDB keys can't contain '.', '#', '$', '[', ']', '/' — none of our STORE
// keys use those characters, so they can be used as Firebase child paths as-is.
// (Kept as named passthroughs so security-rule path prefixes stay human-readable.)
function fbKey(key){ return key; }
function fbKeyDecode(key){ return key; }

/* Patch a single already-rendered field in place (no full re-render) so a live
   update from another user's browser never steals focus or a half-typed value
   from whoever is looking at this screen right now. */
function patchFieldInDom(key, val){
  document.querySelectorAll('[data-store]').forEach(el => {
    if (el.dataset.store === key && document.activeElement !== el) el.value = (val == null ? '' : val);
  });
  document.querySelectorAll('[data-store-check]').forEach(el => {
    if (el.dataset.storeCheck === key) el.checked = !!val;
  });
  document.querySelectorAll('[data-store-select]').forEach(el => {
    if (el.dataset.storeSelect === key && document.activeElement !== el) {
      el.value = val || 'Not started';
      const col = statusColors(el.value);
      el.style.background = col.bg; el.style.color = col.color;
    }
  });
}

function initFirebaseSync(){
  if (typeof firebase === 'undefined') { console.warn('[sync] Firebase SDK did not load — running in local-only mode.'); return; }
  try {
    firebase.initializeApp(FIREBASE_CONFIG);
    fbRef = firebase.database().ref('store');

    firebase.database().ref('.info/connected').on('value', snap => {
      setSyncStatus(!!snap.val());
    });

    let gotInitialSnapshot = false;
    fbRef.on('value', snap => {
      const remote = snap.val() || {};
      let changed = false;
      for (const encKey in remote) {
        const key = fbKeyDecode(encKey);
        const val = remote[encKey];
        if (STORE[key] !== val) {
          STORE[key] = val;
          changed = true;
          if (gotInitialSnapshot) patchFieldInDom(key, val);
        }
      }
      saveStore();
      if (!gotInitialSnapshot) {
        gotInitialSnapshot = true;
        firebaseReady = true;
        renderAll(); // one full repaint once shared data has arrived
      }
    }, err => console.warn('[sync] listener error', err));

    // One-time reconciliation: anything in local STORE not yet in Firebase gets pushed up.
    fbRef.once('value').then(snap => {
      const remote = snap.val() || {};
      const updates = {};
      for (const key in STORE) {
        if (!(fbKey(key) in remote) && STORE[key] !== undefined && STORE[key] !== null && STORE[key] !== '') {
          updates[fbKey(key)] = STORE[key];
        }
      }
      if (Object.keys(updates).length) fbRef.update(updates).catch(()=>{});
    });
  } catch (err) {
    console.warn('[sync] Firebase init failed — running in local-only mode.', err);
  }
}

function setSyncStatus(connected){
  firebaseConnected = connected;
  const el = document.getElementById('syncStatus');
  if (el) {
    el.textContent = connected ? 'Live — shared with everyone' : 'Offline — changes saved on this device only';
    el.style.color = connected ? '#1E4620' : '#9592A6';
    el.previousElementSibling && (el.previousElementSibling.style.background = connected ? '#2E7D32' : '#BDBDBD');
  }
}

    <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px 20px;background:#EDEDED">
      <div class="card" style="max-width:520px;width:100%;padding:32px 34px">
        <div style="max-width:300px;margin-bottom:20px">${LOGO_SVG}</div>
        ${inner}
      </div>
    </div>`;

  // Embedded (e.g. inside Google Sites) — checked BEFORE the loading state, because
  // Firebase Auth often cannot initialize at all in a sandboxed frame (no storage
  // access), in which case waiting for it would hang here forever.
  if (!currentUser && inIframe()) {
    return shell(`
      <div style="font:400 24px/1.3 Roboto,sans-serif;margin-bottom:8px">Staff sign-in required</div>
      <p style="font:400 13.5px/1.7 Roboto,sans-serif;color:rgba(0,0,0,.6);margin:0 0 18px">This portal is restricted to iLearn Schools staff. Sign-in cannot run inside an embedded page, so open it in its own tab to continue.</p>
      <a href="${location.href}" target="_blank" rel="noopener" class="btn-solid" style="display:inline-flex;align-items:center;gap:8px;height:40px;line-height:40px;padding:0 20px">${icon('open_in_new','font-size:18px')}Open the portal to sign in</a>
      <div style="margin-top:20px;padding:12px 14px;background:#FAFAFA;border-radius:4px;font:400 12.5px/1.6 Roboto,sans-serif;color:rgba(0,0,0,.6)">Use your school Google account — any <strong>@ilearnschools.org</strong> or campus charter address.</div>`);
  }

  if (!authReady) {
    return shell(`
      <div style="font:400 14px/1.6 Roboto,sans-serif;color:rgba(0,0,0,.6)">Checking your access&hellip;</div>`);
  }

  if (!currentUser) {
    return shell(`
      <div style="font:400 24px/1.3 Roboto,sans-serif;margin-bottom:8px">Staff sign-in required</div>
      <p style="font:400 13.5px/1.7 Roboto,sans-serif;color:rgba(0,0,0,.6);margin:0 0 18px">Sign in with your school Google account to view the ESL &amp; Bilingual Department portal.</p>
      <button data-signin="1" class="btn-solid" style="display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 20px;font-size:14px">${icon('login','font-size:18px')}Sign in with Google</button>
      ${authError ? `<div style="margin-top:16px;padding:12px 14px;background:#FDECEA;border-radius:4px;font:400 12.5px/1.6 Roboto,sans-serif;color:#5F2120">${esc(authError)}</div>` : ''}
      ${(typeof firebase === 'undefined' || !firebase.auth) ? `<div style="margin-top:16px;padding:12px 14px;background:#FFF4E0;border-radius:4px;font:400 12.5px/1.6 Roboto,sans-serif;color:#663C00">${icon('warning','font-size:15px;vertical-align:-2px')} The Google sign-in library is not loaded on this page, so the button cannot work. Usually the network is blocking <strong>gstatic.com</strong>.</div>` : ''}
      <div style="margin-top:20px">
        <div style="font:500 12px/1.5 Roboto,sans-serif;color:rgba(0,0,0,.6);margin-bottom:6px">Approved domains</div>
        <div style="display:flex;flex-wrap:wrap;gap:5px">
          ${ALLOWED_DOMAINS.map(d => `<span style="display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:9999px;font:400 11.5px/1 Roboto,sans-serif;background:#F5F5F5;color:rgba(0,0,0,.7)">@${d}</span>`).join('')}
        </div>
      </div>`);
  }

  // Signed in, but not on an iLearn domain.
  return shell(`
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">${icon('block','font-size:22px;color:#D32F2F')}<span style="font:400 22px/1.3 Roboto,sans-serif">Access not available</span></div>
    <p style="font:400 13.5px/1.7 Roboto,sans-serif;color:rgba(0,0,0,.6);margin:0 0 6px">You are signed in as <strong>${esc(currentUser.email || 'this account')}</strong>, which is not an iLearn Schools address.</p>
    <p style="font:400 13.5px/1.7 Roboto,sans-serif;color:rgba(0,0,0,.6);margin:0 0 18px">Switch to your school Google account to continue. If you believe you should have access, contact the ESL &amp; Bilingual Department.</p>
    <button data-signout="1" class="btn-solid" style="height:38px;padding:0 18px;font-size:13.5px">Sign in with a different account</button>
    <div style="margin-top:20px">
      <div style="font:500 12px/1.5 Roboto,sans-serif;color:rgba(0,0,0,.6);margin-bottom:6px">Approved domains</div>
      <div style="display:flex;flex-wrap:wrap;gap:5px">
        ${ALLOWED_DOMAINS.map(d => `<span style="display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:9999px;font:400 11.5px/1 Roboto,sans-serif;background:#F5F5F5;color:rgba(0,0,0,.7)">@${d}</span>`).join('')}
      </div>
    </div>`);
}

function statusColors(status){
  if (status === 'Complete') return { bg:'#E8F5E9', color:'#1E4620' };
  if (status === 'In progress') return { bg:'#FFF1DE', color:'#E07A00' };
  return { bg:'#F5F5F5', color:'rgba(0,0,0,.87)' };
}

function journalPrintSheet(id, title, cols, extraHeader){
  const rows = [];
  JOURNAL_DAYS.forEach((day, di) => {
    JOURNAL_PERIODS.forEach((p, pi) => {
      const firstOfDay = pi === 0;
      rows.push(`<tr>
        <td style="padding:0 4px;height:30px;border:1px solid #D5D5D5;font:${firstOfDay?'500':'400'} 9.5px/1.3 Roboto,sans-serif;color:${firstOfDay?'rgba(0,0,0,.87)':'rgba(0,0,0,.38)'};${di%2?'background:#FAFAFA':''}">${firstOfDay?day:''}</td>
        <td style="padding:0 4px;border:1px solid #D5D5D5;font:400 9.5px/1.3 Roboto,sans-serif;color:rgba(0,0,0,.6);${di%2?'background:#FAFAFA':''}">${p}</td>
        ${cols.slice(2).map(() => `<td style="border:1px solid #D5D5D5;${di%2?'background:#FAFAFA':''}"></td>`).join('')}
      </tr>`);
    });
  });
  return `
  <div class="sheet" id="${id}" style="border:1px solid #E0E0E0;border-radius:4px;padding:20px 22px">
    <div style="font:400 11px/1.8 Roboto,sans-serif;letter-spacing:1px;text-transform:uppercase;color:rgba(0,0,0,.6)">iLearn Schools · ESL &amp; Bilingual Department</div>

    <div style="display:flex;gap:18px;margin-bottom:14px">${extraHeader}</div>

      <thead><tr>

      </tr></thead>
      <tbody>${rows.join('')}</tbody>
    </table>
    <div style="display:flex;gap:24px;margin-top:18px">
      <div style="flex:1"><div style="border-bottom:1px solid rgba(0,0,0,.6);height:26px"></div><div style="font:400 10.5px/1.6 Roboto,sans-serif;color:rgba(0,0,0,.6);margin-top:3px">Signature</div></div>

    </div>
  </div>`;
}

        &ldquo;I modeled sentence frames with M.R. and J.T. while they compared two characters&rsquo; motivations. Both used the frame independently on the exit ticket, correctly identifying one similarity and one difference.&rdquo;
      </div>
      <div style="margin-top:12px;padding:12px 14px;background:#E8F4FD;border-radius:4px;font:400 12.5px/1.6 Roboto,sans-serif;color:#014361">Use student <strong>initials</strong>, never full names, in journal narratives.</div>

    <div class="card" style="padding:22px 24px">

      <p style="font:400 12.5px/1.6 Roboto,sans-serif;color:rgba(0,0,0,.6);margin:0 0 12px">What comprehensible input and output typically look like at each level — use it to target the Differentiation &amp; Scaffolds row.</p>
      <div style="display:flex;flex-direction:column;gap:8px">
        ${WIDA_QUICKREF.map(w => `<div style="display:flex;gap:12px;padding-bottom:8px;border-bottom:1px solid #F5F5F5"><span style="font:700 15px/1.3 MuseoModerno,sans-serif;color:#E07A00;width:18px;flex-shrink:0">${w.n}</span><div style="flex:1"><span style="font:500 12.5px/1.5 Roboto,sans-serif">${w.name}</span> <span style="font:400 12.5px/1.6 Roboto,sans-serif;color:rgba(0,0,0,.6)">— ${w.d}</span></div></div>`).join('')}
      </div>

  </div>

  <div class="card" style="padding:22px 24px">
    <h3 style="font:500 16px/1.5 Roboto,sans-serif;margin:0 0 4px">Dropdown Wording</h3>
    <p style="font:400 12.5px/1.6 Roboto,sans-serif;color:rgba(0,0,0,.6);margin:0 0 14px">The exact options used in the spreadsheets. If you complete a form on paper, use this wording so entries stay comparable across the department.</p>
    <div class="g3" style="gap:16px 24px">
      ${DOC_VOCAB.map(v => `
        <div>
          <div style="font:500 12.5px/1.5 Roboto,sans-serif;margin-bottom:6px">${v.t}</div>
          <div style="display:flex;flex-wrap:wrap;gap:5px">
            ${v.items.map(i => `<span style="display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:9999px;font:400 11.5px/1 Roboto,sans-serif;background:#F5F5F5;color:rgba(0,0,0,.7)">${i}</span>`).join('')}
          </div>
        </div>`).join('')}
    </div>
    <div style="margin-top:14px;padding:12px 14px;background:#FFF4E0;border-radius:4px;font:400 12.5px/1.6 Roboto,sans-serif;color:#663C00">In both journals, <strong>On Time? = No</strong> and a role of <strong>Observed Only</strong> or <strong>Did Not Attend</strong> auto-highlight red in the spreadsheet. That is intentional — it makes a week easy to scan.</div>
    <div style="margin-top:10px;padding:12px 14px;background:#E8F5E9;border-radius:4px;font:400 12.5px/1.6 Roboto,sans-serif;color:#1E4620">Campus dropdowns cover all <strong>22 campuses</strong>, including <strong>Bronx ASCS &ndash; Middle (6&ndash;8)</strong>. If your copy still lists 21, you are working from an older file — download a fresh template above.</div>
  </div>

  <div class="card" style="padding:24px 28px">
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap">
      <h3 style="font:500 16px/1.5 Roboto,sans-serif;margin:0;flex:1">Printable Blank Forms</h3>
      <span style="font:400 12px/1 Roboto,sans-serif;color:rgba(0,0,0,.6)">Print landscape. Complete by hand, then enter into the spreadsheet before submitting.</span>
    </div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px">
      ${DOC_TEMPLATES.map(t => `<button class="btn-outline no-print" data-print="${t.sheet}" data-print-orient="${t.orient}">${icon('print','font-size:18px')}${t.name}</button>`).join('')}
    </div>

    ${journalPrintSheet('sheet-teacherjournal','ESL &amp; Bilingual Teacher Push-In Journal', TEACHER_JOURNAL_COLS,
      fieldLine('Teacher Name:','') + fieldLine('School / Campus:','') + fieldLine('Grade Level(s):','120px') + fieldLine('Week Of:','110px'))}

    <div style="height:20px"></div>

    ${journalPrintSheet('sheet-aidejournal','Bilingual Aide Push-In Journal', AIDE_JOURNAL_COLS,
      fieldLine('Aide Name:','') + fieldLine('School / Campus:','') + fieldLine('Grade Level(s):','120px') + fieldLine('Week Of:','110px'))}

    <div style="height:20px"></div>

    <div class="sheet" id="sheet-lessonplan" style="border:1px solid #E0E0E0;border-radius:4px;padding:20px 22px">
      <div style="font:400 11px/1.8 Roboto,sans-serif;letter-spacing:1px;text-transform:uppercase;color:rgba(0,0,0,.6)">iLearn Schools · ESL &amp; Bilingual Department</div>
      <div style="font:500 17px/1.4 Roboto,sans-serif;margin-bottom:12px">ESL Pull-Out Lesson Plan</div>
      <div style="display:flex;gap:18px;margin-bottom:10px">

      <table style="width:100%;border-collapse:collapse;table-layout:fixed">

      <div style="font:500 14px/1.4 Roboto,sans-serif;color:#3D1A73">New York State rules — Bronx campuses only</div>
      <div style="font:400 13px/1.6 Roboto,sans-serif;color:#3D1A73;margin-top:2px">Bronx Arts &amp; Science Charter School follows New York&rsquo;s Commissioner&rsquo;s Regulations Part 154 and NYSED assessment calendar. These requirements are different from the New Jersey campuses — do not apply NJ timelines, cut scores, or forms to Bronx students, or the reverse.</div>

/* ============================= SCREEN: NY ENL PROGRAM & REGULATIONS ============================= */
function renderNyEnl(){
  const uosTable = (t, caption) => `
    <div class="tcard" style="margin-top:10px">
      <table style="width:100%;min-width:760px;border-collapse:collapse">
        <thead><tr>
          <th style="text-align:left;padding:10px 12px;font:500 12.5px/1.4 Roboto,sans-serif;background:#FAFAFA;border-bottom:1px solid rgba(0,0,0,.12);min-width:150px">${caption}</th>
          ${t.cols.map(c => `<th style="text-align:left;padding:10px 12px;font:500 12.5px/1.4 Roboto,sans-serif;background:#FAFAFA;border-bottom:1px solid rgba(0,0,0,.12)">${c}</th>`).join('')}
        </tr></thead>
        <tbody>
          ${t.rows.map((r,i) => `<tr>
            <td style="padding:10px 12px;border-bottom:1px solid rgba(0,0,0,.12);font:500 12.5px/1.5 Roboto,sans-serif;${i===t.rows.length-1?'background:#FAFAFA':''}">${r.label}</td>
            ${r.vals.map(v => `<td style="padding:10px 12px;border-bottom:1px solid rgba(0,0,0,.12);font:400 12.5px/1.5 Roboto,sans-serif;color:${i===t.rows.length-1?'rgba(0,0,0,.87)':'rgba(0,0,0,.6)'};${i===t.rows.length-1?'background:#FAFAFA;font-weight:500':''}">${v}</td>`).join('')}
          </tr>`).join('')}
        </tbody>
      </table>
    </div>`;

  return `
  ${nyBanner()}

  <div style="display:flex;align-items:flex-start;gap:12px;background:#FFF4E0;border-radius:4px;padding:14px 18px">
    ${icon('swap_horiz','font-size:22px;color:#663C00')}
    <div>
      <div style="font:500 14px/1.4 Roboto,sans-serif;color:#663C00">2026–27 is a transition year: NYSESLAT is gone</div>
      <div style="font:400 13px/1.6 Roboto,sans-serif;color:#663C00;margin-top:2px">New York has joined the WIDA Consortium. The final NYSESLAT was administered in Spring 2026. <strong>WIDA ACCESS becomes the annual assessment this year (Feb 1 &ndash; Apr 9, 2027)</strong>, while the <strong>NYSITELL remains the identification test through 2026&ndash;27</strong> — the WIDA Screener replaces it in Fall 2027. The 2025&ndash;26 NYC policy guide still describes NYSESLAT throughout; read it with that substitution in mind.</div>
    </div>
  </div>

  <div class="g2">
    <div class="card" style="padding:22px 24px">
      <h3 style="font:500 16px/1.5 Roboto,sans-serif;margin:0 0 4px">What ENL Is</h3>
      <p style="font:400 12.5px/1.6 Roboto,sans-serif;color:rgba(0,0,0,.6);margin:0 0 12px">Under CR Part 154 every school must offer an ENL program at minimum. One unit of study = 180 minutes per week.</p>
      <div style="display:flex;flex-direction:column;gap:12px">
        <div style="background:#FAFAFA;border-radius:4px;padding:14px">
          <div style="font:500 13.5px/1.4 Roboto,sans-serif;color:#006DBD">Stand-alone ENL</div>
          <div style="font:400 12.5px/1.6 Roboto,sans-serif;color:rgba(0,0,0,.6);margin-top:4px">English language development taught by a NYS certified ESOL teacher, as a separate block devoted to language development. <strong>It may not be delivered as push-in inside a content class</strong> — that distinction matters for compliance.</div>
        </div>
        <div style="background:#FAFAFA;border-radius:4px;padding:14px">
          <div style="font:500 13.5px/1.4 Roboto,sans-serif;color:#E07A00">Integrated ENL</div>
          <div style="font:400 12.5px/1.6 Roboto,sans-serif;color:rgba(0,0,0,.6);margin-top:4px">Core content plus language development in the same period, with home language supports and ELL scaffolds. In grades K&ndash;8, Entering through Transitioning pair with ELA; at Expanding it may pair with any content area. In grades 9&ndash;12, Entering and Emerging pair with ELA; Transitioning and Expanding may pair with any content area.</div>
        </div>
      </div>
      <div style="margin-top:12px;padding:12px 14px;background:#E8F4FD;border-radius:4px;font:400 12.5px/1.6 Roboto,sans-serif;color:#014361">All ENL classes, integrated and stand-alone, offer home language support. Maximum grade span for grouping is two contiguous grades — <em>except</em> for ELLs in a special education class as defined by &sect; 200.1(uu). All programs must be provided during the school day.</div>
    </div>

    <div class="card" style="padding:22px 24px">
      <h3 style="font:500 16px/1.5 Roboto,sans-serif;margin:0 0 4px">Proficiency Levels</h3>
      <p style="font:400 12.5px/1.6 Roboto,sans-serif;color:rgba(0,0,0,.6);margin:0 0 12px">Five levels. The level drives how many minutes of ENL a student receives.</p>
      <div style="display:flex;flex-direction:column;gap:8px">
        ${NY_PROFICIENCY.map(p => `
          <div style="display:flex;gap:14px;padding-bottom:8px;border-bottom:1px solid #F5F5F5">
            <span style="width:26px;height:26px;flex-shrink:0;border-radius:50%;background:${p.n==='5'?'#2E7D32':'#0074C8'};color:#fff;font:700 13px/26px MuseoModerno,sans-serif;text-align:center">${p.n}</span>
            <div style="flex:1;min-width:0">
              <div style="font:500 13.5px/1.4 Roboto,sans-serif">${p.name} <span style="font:400 12px/1.4 Roboto,sans-serif;color:#9592A6">${p.sub}</span></div>
              <div style="font:400 12.5px/1.6 Roboto,sans-serif;color:rgba(0,0,0,.6)">${p.desc}</div>
            </div>
            <span class="badge" style="flex-shrink:0;background:${p.n==='5'?'#E8F5E9':'#FFF1DE'};color:${p.n==='5'?'#1E4620':'#E07A00'};align-self:flex-start">${p.ell}</span>
          </div>`).join('')}
      </div>
      <div style="margin-top:10px;padding:12px 14px;background:#FAFAFA;border-radius:4px;font:400 12.5px/1.6 Roboto,sans-serif;color:rgba(0,0,0,.6)">Commanding on the <strong>identification screener</strong> means the student is not an ELL and is <strong>not</strong> a former ELL — no former-ELL services or accommodations. Commanding on the <strong>annual assessment</strong> means the student has exited and <strong>is</strong> a former ELL, entitled to two years of services and testing accommodations.</div>
    </div>
  </div>

  <div class="card" style="padding:22px 24px">
    <h3 style="font:500 16px/1.5 Roboto,sans-serif;margin:0 0 4px">ENL Units of Study — CR Part 154-2</h3>
    <p style="font:400 12.5px/1.6 Roboto,sans-serif;color:rgba(0,0,0,.6);margin:0 0 4px">Minimum required minutes per week by grade band and proficiency level. These are floors, not targets.</p>
    <div style="font:500 13px/1.6 Roboto,sans-serif;margin-top:14px">Grades K–8</div>
    ${uosTable(NY_UOS_K8,'Instruction')}
    <div style="font:500 13px/1.6 Roboto,sans-serif;margin-top:20px">Grades 9–12</div>
    ${uosTable(NY_UOS_912,'Instruction')}
    <div style="margin-top:14px;padding:12px 14px;background:#E8F4FD;border-radius:4px;font:400 12.5px/1.6 Roboto,sans-serif;color:#014361">Read the <strong>flexible unit</strong> row together with the two rows above it. The flexible 0.5 unit may be delivered as either stand-alone or integrated ENL, so actual stand-alone time can exceed the fixed row — an Emerging student in K&ndash;8 may receive up to a full unit of stand-alone ENL, and a 9&ndash;12 Entering student between 180 and 360 minutes.</div>
    <div style="margin-top:10px;padding:12px 14px;background:#FFF4E0;border-radius:4px;font:400 12.5px/1.6 Roboto,sans-serif;color:#663C00">High school credit: stand-alone ENL earns elective credit; integrated ENL earns core content credit in ELA, Math, Science, or Social Studies upon passing each corresponding unit of study.</div>
  </div>

  <div class="g2">
    <div class="card" style="padding:22px 24px">
      <h3 style="font:500 16px/1.5 Roboto,sans-serif;margin:0 0 12px">Staffing &amp; Certification</h3>
      <div style="display:flex;flex-direction:column;gap:10px">
        ${NY_STAFFING.map(s => `<div style="display:flex;gap:14px;padding-bottom:10px;border-bottom:1px solid #F5F5F5"><div style="flex:1"><div style="font:500 13px/1.5 Roboto,sans-serif">${s.model}</div><div style="font:400 12.5px/1.6 Roboto,sans-serif;color:rgba(0,0,0,.6);margin-top:2px">${s.who}</div></div></div>`).join('')}

      <h3 style="font:500 16px/1.5 Roboto,sans-serif;margin:18px 0 8px">Bilingual Program Thresholds</h3>
      <div style="display:flex;flex-direction:column;gap:10px">

        <div style="display:flex;gap:14px;align-items:baseline"><span style="font:700 16px/1.3 MuseoModerno,sans-serif;width:70px;flex-shrink:0">9–12</span><span style="font:400 13px/1.6 Roboto,sans-serif;color:rgba(0,0,0,.6)">20 or more ELLs of the same home language in any single grade.</span></div>

      <div style="margin-top:12px;padding:12px 14px;background:#FDECEA;border-radius:4px;font:400 12.5px/1.6 Roboto,sans-serif;color:#5F2120">If a threshold is met, CR Part 154 <strong>mandates</strong> opening a bilingual program. Track parent program requests continuously so a threshold is never crossed unnoticed.</div>
    </div>

    <div class="card" style="padding:22px 24px;border-top:3px solid #2E7D32">
      <h3 style="font:500 16px/1.5 Roboto,sans-serif;margin:0 0 4px">Exiting ELL Status</h3>

      <div style="display:flex;flex-direction:column;gap:9px">

      <div style="margin-top:10px;font:400 12.5px/1.6 Roboto,sans-serif;color:rgba(0,0,0,.6)">For pathways 2 and 3, both scores must come from administrations within the same school year. August Regents results may pair with the prior spring&rsquo;s annual assessment.</div>
      <div style="margin-top:10px;padding:12px 14px;background:#FFF4E0;border-radius:4px;font:400 12.5px/1.6 Roboto,sans-serif;color:#663C00">These three pathways are the <strong>NYSESLAT-era</strong> criteria as written in the 2025&ndash;26 guide. With WIDA ACCESS replacing NYSESLAT this year, <strong>confirm the 2026&ndash;27 exit determination and cut score with OBEWL before exiting any student.</strong></div>
      <div class="hairline" style="margin:16px 0"></div>
      <div style="font:500 14px/1.5 Roboto,sans-serif;margin-bottom:6px">Former ELLs — required service after exiting</div>
      <p style="font:400 12.5px/1.6 Roboto,sans-serif;color:rgba(0,0,0,.6);margin:0 0 10px">At least 0.5 units (90 minutes per week) of Integrated ENL, or one approved alternative pathway, for <strong>at least two school years following the school year in which the student exited</strong> — the regulation sets a floor, not a ceiling, and the clock starts at the end of the exit year. Services must be delivered during the school day; anything outside the bell schedule does not count toward the 90-minute mandate.</p>
      <div style="display:flex;flex-direction:column;gap:7px">
        ${NY_FORMER_PATHWAYS.map(p => `<div style="display:flex;gap:12px"><span style="font:500 12.5px/1.6 Roboto,sans-serif;width:64px;flex-shrink:0;color:#2E7D32">${p.opt}</span><span style="font:400 12.5px/1.6 Roboto,sans-serif;color:rgba(0,0,0,.6);flex:1">${p.t}</span></div>`).join('')}
      </div>
      <div style="margin-top:12px;padding:12px 14px;background:#FDECEA;border-radius:4px;font:400 12.5px/1.6 Roboto,sans-serif;color:#5F2120">Option B (individualized targeted learning) and World Language AP classes are <strong>no longer valid</strong> pathways — both were retired in Fall 2019.</div>
    </div>

  <div class="card" style="padding:22px 24px">
    <h3 style="font:500 16px/1.5 Roboto,sans-serif;margin:0 0 4px">Identification — the 8 + 2 Step Process</h3>
    <p style="font:400 12.5px/1.6 Roboto,sans-serif;color:rgba(0,0,0,.6);margin:0 0 14px">Complete within <strong>10 school days</strong> of enrollment, or <strong>20 school days</strong> for a student entering with an IEP. Steps 9 and 10 are used only when a determination is challenged.</p>
    <div style="display:flex;flex-direction:column">
      ${NY_IDENT_STEPS.map(s => `
        <div style="display:flex;gap:16px;padding:12px 0;border-top:1px solid #F5F5F5">
          <span style="width:28px;height:28px;flex-shrink:0;border-radius:50%;background:${Number(s.n)>8?'#9747FF':'#0074C8'};color:#fff;font:700 13px/28px MuseoModerno,sans-serif;text-align:center">${s.n}</span>

            <div style="font:500 13.5px/1.5 Roboto,sans-serif">${s.title}</div>

          </div>
        </div>`).join('')}
    </div>
  </div>

  <div class="g2">
    <div class="card" style="padding:22px 24px;border-top:3px solid #D32F2F">
      <div style="font:400 12px/2.66 Roboto,sans-serif;letter-spacing:1px;text-transform:uppercase;color:#9592A6">NY Education Law § 3201-b</div>
      <h3 style="font:500 16px/1.5 Roboto,sans-serif;margin:0 0 4px">Immigration-Status Protections</h3>
      <p style="font:400 12.5px/1.6 Roboto,sans-serif;color:rgba(0,0,0,.6);margin:0 0 12px">Effective May 27, 2026. Codifies <em>Plyler v. Doe</em> in New York law and <strong>names charter schools explicitly</strong>. Staff are strictly prohibited from:</p>
      <div style="display:flex;flex-direction:column;gap:8px">
        ${[
          'Using school resources for immigration enforcement purposes.',
          'Asking about, collecting, or disclosing a student&rsquo;s or family&rsquo;s citizenship or immigration status.',
          'Treating immigration status, citizenship, or national origin as &ldquo;directory information.&rdquo;',
          'Using enrollment requirements that delay or deny enrollment of non-citizen students — including delaying class attendance because documents are not immediately available.',
          'Granting immigration authorities access to non-public areas without a valid federal judicial warrant signed by a U.S. District Court or Magistrate judge.',
          'Releasing a student into immigration custody based on a civil warrant, detainer, or notice to appear.',
          'Using immigration authorities as interpreters or translators.'
        ].map(t => `<div style="display:flex;gap:10px">${icon('block','font-size:16px;color:#D32F2F;flex-shrink:0')}<span style="font:400 12.5px/1.6 Roboto,sans-serif">${t}</span></div>`).join('')}
      </div>
      <div style="margin-top:12px;padding:12px 14px;background:#FDECEA;border-radius:4px;font:400 12.5px/1.6 Roboto,sans-serif;color:#5F2120">Each school must designate a specific person to handle any request from immigration authorities, consult the district attorney before responding, and notify the SED Privacy Office. If a guardian is detained, keep the student safely on premises and exhaust every authorized emergency contact first.</div>
    </div>

    <div class="card" style="padding:22px 24px">
      <h3 style="font:500 16px/1.5 Roboto,sans-serif;margin:0 0 4px">Parent Rights &amp; Records</h3>
      <p style="font:400 12.5px/1.6 Roboto,sans-serif;color:rgba(0,0,0,.6);margin:0 0 12px">All notices in the parent&rsquo;s preferred language; all meetings with a qualified interpreter.</p>
      <div style="display:flex;flex-direction:column;gap:9px">
        ${[
          ['Parent orientation','Covers all three program types, learning standards, assessments, and expectations. Parents complete the program agreement form.'],
          ['Annual ELL parent meeting','Individually, at least once a year, with an interpreter — separate from parent-teacher conferences.'],
          ['Letters to retain','Entitlement and non-entitlement after the screener, placement letter, default placement letter, continued entitlement, and exit / non-entitlement after the annual assessment.'],
          ['Cumulative folder','All identification documentation, LPT records, SIFE evidence, every parent notification, orientation attendance, assessment scores, and evidence of the annual parent meeting.'],
          ['School-level ELL folder','A central folder of critical documents — samples of every student-level document, plus records of program planning. Every document signed, dated, and translated where applicable.']
        ].map(([k,v]) => `<div><div style="font:500 13px/1.5 Roboto,sans-serif">${k}</div><div style="font:400 12.5px/1.6 Roboto,sans-serif;color:rgba(0,0,0,.6)">${v}</div></div>`).join('')}
      </div>
    </div>
  </div>

  <div class="card" style="padding:22px 24px">
    <h3 style="font:500 16px/1.5 Roboto,sans-serif;margin:0 0 4px">What Applies to a NY Charter School</h3>
    <p style="font:400 12.5px/1.6 Roboto,sans-serif;color:rgba(0,0,0,.6);margin:0 0 14px">The NYC DOE policy guide is the clearest summary of CR Part 154 available, but much of it describes NYC DOE district systems that Bronx ASCS does not use. Read it with this split in mind.</p>
    <div class="g2" style="gap:24px">
      <div>
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">${icon('check_circle','font-size:18px;color:#2E7D32')}<span style="font:500 13.5px/1.5 Roboto,sans-serif;color:#1E4620">Applies to Bronx ASCS</span></div>
        <div style="display:flex;flex-direction:column;gap:8px">
          ${NY_APPLIES.filter(a=>a.yes).map(a => `<div style="display:flex;gap:10px;font:400 12.5px/1.6 Roboto,sans-serif"><span style="color:#2E7D32">&bull;</span><span>${a.t}</span></div>`).join('')}
        </div>
      </div>
      <div>
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">${icon('cancel','font-size:18px;color:#9592A6')}<span style="font:500 13.5px/1.5 Roboto,sans-serif;color:rgba(0,0,0,.6)">NYC DOE district-only — reference, not requirements</span></div>
        <div style="display:flex;flex-direction:column;gap:8px">
          ${NY_APPLIES.filter(a=>!a.yes).map(a => `<div style="display:flex;gap:10px;font:400 12.5px/1.6 Roboto,sans-serif;color:rgba(0,0,0,.6)"><span style="color:#BDBDBD">&bull;</span><span>${a.t}</span></div>`).join('')}
        </div>
      </div>
    </div>
    <div style="margin-top:14px;padding:12px 14px;background:#E8F4FD;border-radius:4px;font:400 12.5px/1.6 Roboto,sans-serif;color:#014361">Bronx ASCS records ELL data in the iLearn SIS and reports to its charter authorizer and NYSED, not through ATS or STARS. Confirm the authorizer&rsquo;s specific ELL reporting requirements with the Department Head.</div>
  </div>

  <div class="card" style="padding:22px 24px">
    <h3 style="font:500 16px/1.5 Roboto,sans-serif;margin:0 0 4px">NYSED Blueprint for ELL/MLL Success</h3>
    <p style="font:400 12.5px/1.6 Roboto,sans-serif;color:rgba(0,0,0,.6);margin:0 0 14px">Eight statewide principles from the Office of Bilingual Education and World Languages. The Blueprint cites a population of 261,848 ELLs/MLLs speaking over 200 languages — note the document is undated and that figure is not a 2026 count.</p>
    <div class="g2" style="gap:10px 24px">
      ${NY_BLUEPRINT.map((b,i) => `<div style="display:flex;gap:12px;padding:8px 0;border-bottom:1px solid #F5F5F5"><span style="font:700 15px/1.3 MuseoModerno,sans-serif;color:#E07A00;width:22px;flex-shrink:0">${i+1}</span><span style="font:400 12.5px/1.6 Roboto,sans-serif">${b}</span></div>`).join('')}
    </div>
    <div style="margin-top:14px;padding:12px 14px;background:#FFF1DE;border-radius:4px;font:400 13px/1.6 Roboto,sans-serif;color:#663C00">OBEWL is explicit that it is <strong>not permissible</strong> to assume unsupported immersion into an English-speaking environment will let an ELL/MLL succeed academically.</div>
  </div>`;
}

/* ============================= SCREEN: NY ENL TIMELINE ============================= */

  </div>

  <div class="card" style="padding:22px 24px">
    <div style="display:flex;flex-direction:column">
      ${NY_TIMELINE.map(t => {
        const k = NY_TIMELINE_KIND[t.kind] || NY_TIMELINE_KIND.op;
        return `
        <div style="display:flex;gap:20px;padding:14px 0;border-top:1px solid #F5F5F5">
          <div style="width:190px;flex-shrink:0">
            <div style="font:700 15px/1.3 MuseoModerno,sans-serif;letter-spacing:.02em;color:rgba(0,0,0,.87)">${t.date}</div>
            <div style="font:400 12px/1.5 Roboto,sans-serif;color:#9592A6;margin-top:3px">${t.sub}</div>

          </div>
          <div style="flex:1;min-width:0">
            <div style="font:500 14px/1.5 Roboto,sans-serif">${t.title}</div>
            <div style="font:400 13px/1.7 Roboto,sans-serif;color:rgba(0,0,0,.6);margin-top:3px">${t.body}</div>
          </div>
          <div style="width:110px;flex-shrink:0;text-align:right">
            <span class="badge" style="background:#F5F5F5;color:rgba(0,0,0,.6)">${t.tag}</span>
          </div>
        </div>`;
      }).join('')}
    </div>
  </div>

  <div class="g2">
    <div class="card" style="padding:22px 24px">
      <h3 style="font:500 16px/1.5 Roboto,sans-serif;margin:0 0 4px">WIDA ACCESS Scheduling Squeeze</h3>
      <p style="font:400 12.5px/1.6 Roboto,sans-serif;color:rgba(0,0,0,.6);margin:0 0 12px">The state window looks like ten weeks. On the Bronx calendar it is far less.</p>
      <div class="g3" style="gap:10px">
        <div style="background:#FAFAFA;border-radius:4px;padding:14px;text-align:center"><div style="font:700 26px/1 MuseoModerno,sans-serif;color:#5B2AA8">37</div><div style="font:400 11.5px/1.4 Roboto,sans-serif;color:#9592A6;margin-top:4px">school days actually available</div></div>
        <div style="background:#FAFAFA;border-radius:4px;padding:14px;text-align:center"><div style="font:700 26px/1 MuseoModerno,sans-serif;color:#5B2AA8">13</div><div style="font:400 11.5px/1.4 Roboto,sans-serif;color:#9592A6;margin-top:4px">weekdays closed inside the window</div></div>
        <div style="background:#FAFAFA;border-radius:4px;padding:14px;text-align:center"><div style="font:700 26px/1 MuseoModerno,sans-serif;color:#D32F2F">5</div><div style="font:400 11.5px/1.4 Roboto,sans-serif;color:#9592A6;margin-top:4px">days overlapping grades 3–8 ELA/Math</div></div>
      </div>
      <div style="margin-top:12px;font:400 12.5px/1.6 Roboto,sans-serif;color:rgba(0,0,0,.6)">Closures falling inside Feb 1 &ndash; Apr 9: Feb 12 (staff development), Midwinter Recess Feb 15&ndash;19, Eid al-Fitr Mar 9, and Spring Recess Mar 26 &ndash; Apr 2.</div>
      <div style="margin-top:12px;padding:12px 14px;background:#FFF4E0;border-radius:4px;font:400 12.5px/1.6 Roboto,sans-serif;color:#663C00">Plan to finish WIDA ACCESS <strong>before spring recess</strong>. The final week of the window (Apr 5&ndash;9) collides with the opening of the grades 3&ndash;8 ELA and Math window, and make-ups cannot run past Apr 9.</div>
    </div>

    <div class="card" style="padding:22px 24px">
      <h3 style="font:500 16px/1.5 Roboto,sans-serif;margin:0 0 4px">How These Dates Were Derived</h3>
      <p style="font:400 12.5px/1.6 Roboto,sans-serif;color:rgba(0,0,0,.6);margin:0 0 12px">So you can re-check any of them.</p>
      <div style="display:flex;flex-direction:column;gap:10px">

      </div>
    </div>
  </div>`;
}

      <span style="font:400 13.5px/1.5 Roboto,sans-serif;flex:1;min-width:0">${name}</span>

    <div style="display:flex;align-items:center;gap:16px;padding:12px 16px;background:#E8F4FD;border-radius:4px;flex-wrap:wrap;margin:12px 0 14px">
      ${icon('lightbulb','font-size:20px;color:#0288D1')}

    <div style="display:flex;flex-direction:column">

    <div style="display:flex;flex-direction:column">

    <div style="margin-top:12px;font:400 12px/1.6 Roboto,sans-serif;color:#9592A6">Forthcoming from CTE TAC: Supporting MLLs with Disabilities, and Supporting MLLs from Other Special Populations.</div>
  </div>

  <div class="card" style="padding:22px 24px">
    <h3 style="font:500 16px/1.5 Roboto,sans-serif;margin:0 0 4px">NYSED &amp; State Resources</h3>
    <p style="font:400 12.5px/1.6 Roboto,sans-serif;color:rgba(0,0,0,.6);margin:0 0 14px">Authoritative sources for regulations, assessment, and accommodations.</p>
    <div style="display:flex;flex-direction:column">
      ${NY_NYSED_LINKS.map(l => linkRow(l.name, l.meta, l.url)).join('')}
    </div>
  </div>

  <div class="g2">
    <div class="card" style="padding:22px 24px">
      <h3 style="font:500 16px/1.5 Roboto,sans-serif;margin:0 0 12px">Key Contacts — New York</h3>
      <div style="display:flex;flex-direction:column;gap:10px">
        ${[
          ['NYSED Office of Bilingual Education and World Languages','(518) 474-8775'],
          ['Regional Bilingual Education Resource Network (RBERN)','Regional PD and technical assistance'],
          ['WIDA Client Services','help@wida.us · (866) 276-7735'],
          ['DRC — WIDA test materials','wida@datarecognitioncorp.com'],
          ['CTE Technical Assistance Center of New York','ctetac@spnet.us · (518) 723-2137'],
          ['ESL / Bilingual Department Head — Ms. Cosgun','gcosgun@ilearnschools.org']
        ].map(([w,h]) => `<div style="display:flex;gap:14px;padding-bottom:9px;border-bottom:1px solid #F5F5F5"><span style="font:400 13px/1.6 Roboto,sans-serif;flex:1">${w}</span><span style="font:400 13px/1.6 Roboto,sans-serif;color:rgba(0,0,0,.6);text-align:right">${h}</span></div>`).join('')}

      <div style="margin-top:14px;padding:12px 14px;background:#FDECEA;border-radius:4px;font:400 12.5px/1.6 Roboto,sans-serif;color:#5F2120">Never include student personally identifying information in email to NYSED or NYC DOE. Under § 3201-b, never include or request anything relating to immigration status.</div>
    </div>

    <div class="card" style="padding:22px 24px">
      <h3 style="font:500 16px/1.5 Roboto,sans-serif;margin:0 0 4px">Source Documents</h3>
      <p style="font:400 12.5px/1.6 Roboto,sans-serif;color:rgba(0,0,0,.6);margin:0 0 12px">This NY section was built from these four documents. Keep copies in the department&rsquo;s shared drive.</p>
      <div style="display:flex;flex-direction:column;gap:10px">
        ${[
          ['Policy and Reference Guide for MLs/ELLs','NYC DOE Office of Multilingual Learners, August 2025 · 205 pp · SY 2025&ndash;26'],
          ['Final Dates for 2026–27 Elementary- and Intermediate-level Testing','NYSED Office of State Assessment, June 2026'],
          ['Model Policy and Compliance Procedures: NY Educ. Law § 3201-b','NYSED Office of Counsel · effective May 27, 2026'],
          ['Blueprint for ELL/MLL Success','NYSED Office of Bilingual Education and World Languages']
        ].map(([n,m]) => `<div style="padding-bottom:10px;border-bottom:1px solid #F5F5F5"><div style="font:500 13px/1.5 Roboto,sans-serif">${n}</div><div style="font:400 12px/1.6 Roboto,sans-serif;color:#9592A6;margin-top:2px">${m}</div></div>`).join('')}
      </div>
      <div style="margin-top:12px;padding:12px 14px;background:#FFF4E0;border-radius:4px;font:400 12.5px/1.6 Roboto,sans-serif;color:#663C00">The NYC policy guide is the 2025&ndash;26 edition and predates the WIDA transition — it describes NYSESLAT throughout. Watch for the 2026&ndash;27 edition, and confirm anything assessment-related against NYSED directly.</div>
    </div>
  </div>`;
}

/* ============================= MAIN RENDER ============================= */
const SCREEN_RENDERERS = {
  dash: renderDash, timeline: renderTimeline, ident: renderIdent, service: renderService,
  docs: renderDocs,
  exit: renderExit, fml: renderFml, notices: renderNotices, plc: renderPlc, pac: renderPac,
  wida: renderWida, curriculum: renderCurriculum,
  nyenl: renderNyEnl, nytimeline: renderNyTimeline, nyresources: renderNyResources
};

function renderAll(){
  const sb = document.getElementById('sidebar');
  const main = document.getElementById('main');
  // Nothing renders until an approved account is signed in. The Firebase rules
  // enforce the same thing server-side, so this is UX, not the security boundary.
  if (!canView) {
    sb.innerHTML = '';
    sb.style.display = 'none';
    main.innerHTML = renderGate();
    return;
  }
  sb.style.display = '';
  sb.innerHTML = renderSidebar();
  main.innerHTML = renderHeader() + (SCREEN_RENDERERS[state.screen] || renderDash)();
  applyLockState(); // runs before paint, so locked fields never flash as editable
}

/* ============================= EVENTS ============================= */
document.addEventListener('click', e => {
  const navBtn = e.target.closest('[data-nav]');
  if (navBtn) { state.screen = navBtn.dataset.nav; renderAll(); window.scrollTo(0,0); return; }

  const roleBtn = e.target.closest('[data-role]');
  if (roleBtn) { state.role = roleBtn.dataset.role; renderAll(); return; }

  const letterCard = e.target.closest('[data-letter]');
  if (letterCard) { state.letter = letterCard.dataset.letter; renderAll(); return; }

  if (e.target.closest('[data-signin]')) { signIn(); return; }
  if (e.target.closest('[data-signout]')) { signOutUser(); return; }

  const printBtn = e.target.closest('[data-print]');
  if (printBtn) {
    const sheet = document.getElementById(printBtn.dataset.print);
    const area = document.getElementById('printArea');
    if (sheet && area) {
      area.innerHTML = sheet.outerHTML;
      // Wide forms (the journals and the weekly lesson-plan grid) only fit landscape.
      // @page can't be toggled by class, so inject the rule and remove it afterward.
      setPrintOrientation(printBtn.dataset.printOrient === 'landscape' ? 'landscape' : 'portrait');
      document.body.classList.add('print-scoped');
      // Double rAF: guarantees the browser has actually applied the print-scoped
      // layout/style change before the print dialog opens (avoids a race where
      // window.print() fires before the style recalculation is committed).
      requestAnimationFrame(() => requestAnimationFrame(() => window.print()));
    } else {
      window.print();
    }
    return;
  }
});

/* Inject/remove an @page orientation rule for the current print job. */
function setPrintOrientation(orient){
  let el = document.getElementById('printOrientStyle');
  if (!el) {
    el = document.createElement('style');
    el.id = 'printOrientStyle';
    document.head.appendChild(el);
  }
  el.textContent = '@page { size: ' + (orient === 'landscape' ? 'landscape' : 'portrait') + '; margin: 0.4in; }';
}
function clearPrintOrientation(){
  const el = document.getElementById('printOrientStyle');
  if (el) el.remove();
}

// Safety net: if print is triggered any other way (Ctrl+P, browser/print-icon,
// right-click > Print) instead of clicking our own Print button, the click handler
// above never runs. Catch it here and scope to whichever printable form (.sheet)
// is currently visible on screen, so the whole app never prints by accident.
window.addEventListener('beforeprint', () => {
  const area = document.getElementById('printArea');
  if (!area) return;
  if (document.body.classList.contains('print-scoped') && area.innerHTML.trim()) return; // already handled by the click above
  const visibleSheet = document.querySelector('#main .sheet');
  if (visibleSheet) {
    area.innerHTML = visibleSheet.outerHTML;
    document.body.classList.add('print-scoped');
  }
});

window.addEventListener('afterprint', () => {
  document.body.classList.remove('print-scoped');
  clearPrintOrientation();
  const area = document.getElementById('printArea');
  if (area) area.innerHTML = '';
});

document.addEventListener('change', e => {
  if (e.target.id === 'campusSelect') { state.campus = e.target.value; renderAll(); return; }
  if (e.target.id === 'langSelect') { state.lang = e.target.value; renderAll(); return; }

  const statusSel = e.target.closest('[data-store-select]');
  if (statusSel) {
    const key = statusSel.dataset.storeSelect;
    sset(key, statusSel.value);
    const col = statusColors(statusSel.value);
    statusSel.style.background = col.bg; statusSel.style.color = col.color;
    return;
  }

  const chk = e.target.closest('[data-store-check]');
  if (chk) { sset(chk.dataset.storeCheck, chk.checked); return; }
});

document.addEventListener('input', e => {
  const field = e.target.closest('[data-store]');
  if (field) {
    sset(field.dataset.store, field.value);
    // live-update Zoom link rendering without losing focus elsewhere isn't needed;
    // full refresh happens next navigation.
  }
});

renderAll();   // renders the gate; the app itself is not built until access is confirmed
initAuth();    // starts Firebase sync only once an approved account is signed in
</script>
</body>
